# 受众画像（任务05）——选题评分与分析的受众依据
# 性质：用户直接提供的偏好描述（PRD 05 库「用户偏好」类），非 AI 推断假设；
#       代码经 src/analysis/audience.py 读取，评分引擎按本文件做受众匹配与负面降权。
# 版本：修改信号词必须同步升 profile_id 版本号（评分结果可追溯，PRD 5.3）。
profile_id: audience-zh-ai-creator-v1
name: 中文 AI 短视频受众（想入局的 AI 自媒体人）
updated_at: "2026-10-30"
source: 任务05 任务书（用户提供，原文摘录）
description: >-
  对 AI 感兴趣的中文用户；想做 AI 短视频、想当 AI 博主、想用 AI 编程做小程序/应用；
  受国内网络与访问限制困扰，很多国外软件用不上，想知道怎么用国外工具、
  以及国内替代工具怎么用。
platforms: [抖音, 小红书]
languages: [zh, en]
interests:
  - AI 短视频制作与起号（脚本、剪辑、配音、数字人、一键成片）
  - AI 博主/自媒体方法论（选题、涨粉、变现路径）
  - 用 AI 编程做小程序/应用（vibe coding、对话式编程、零基础做产品）
  - 国外 AI 工具怎么用（注册、订阅、网络与账号限制的绕行/合规姿势）
  - 国内可用/不可用判断与替代工具（平替方案）
pain_points:
  - 国内网络与访问限制，很多国外软件用不上
  - 不知道某个国外工具国内能不能用、有没有替代品
  - 非程序员出身，担心 AI 编程/新工具上手门槛
  - AI 信息过载，分不清哪些变化和自己有关
# ---------------------------------------------------------------------------
