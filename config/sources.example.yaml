# 信息源配置模板（来源与权重可在运行时调整，属运营参数而非已验证最佳比例）
sources:
  aihot:
    enabled: true
    base_url: https://aihot.news
    mode: selected          # /api/v1/items，匿名只读
    limit: 20               # P1 小规模约束：单轮 ≤ 20 条
    window: 7d
    note: robots.txt 放行 /api/v1；旧 /api/public/* 已于 2026-10-31 停服，禁用

  x_following:
    enabled: true
    # Pi Agent 不访问 X；名单由 Grok Bot 读取后以文件交付（任务02 决定）
    list_file: /workspace/ai-zimeiti/inputs/x_following.json
    content_available: false   # X 帖子内容不可得 → 已知缺口，报告中注明

  x_discovery:
    enabled: false         # 未授权，不启用

  overseas_case:
    enabled: false         # P1 未接，未完成项见 docs/phase-reports

  github_domestic:
    enabled: false         # 只读入口预留（PRD 3.5 D 级），未配置

  feishu_domestic:
    enabled: false         # 只读入口预留（PRD 3.5 D 级），未配置

weights:                   # 优先级（PRD 3.6）：可调参数
  x_following: 5
  aihot: 3
  x_discovery: 2
  overseas_case: 1

limits:
  notion_throttle_seconds: 0.35   # ≈2.9 req/s < Notion 3 req/s
  retry_max: 4

# ===== 阶段2-B：GitHub 连接器（官方 REST，topic 查询可改） =====
github:
  enabled: true
  top: 5                    # 默认取前 5 个，可用 --github-top 覆盖
  since_days: 30            # pushed:>近30天
  themes:
    - id: mcp
      label: MCP
      query: "topic:mcp"
    - id: ai_agent
      label: AI agent
      query: "topic:ai-agents"
    - id: ai_coding
      label: AI coding tools
      # GitHub 仓库搜索不支持 A OR B in:description；每条查询独立检索后合并
      queries:
        - 'topic:ai-coding'
        - '"AI coding" in:description'
    - id: ai_automation
      label: AI automation
      query: 'topic:automation AI in:description'
    - id: ai_video
      label: AI video generation
      queries:
        - 'topic:ai-video'
        - '"video generation" in:description'
    - id: ai_app_dev
      label: AI app dev
      queries:
        - 'topic:vibe-coding'
        - '"app builder" in:description'
    - id: side_hustle
      label: side-hustle tools（副业工具）
      queries:
        - 'topic:side-hustle'
        - '"side project" in:description'
    - id: beginner
      label: beginner-usable open source
      queries:
        - 'topic:no-code'
        - '"beginner friendly" in:description'

# ===== 阶段2-B：官方源（≤5，URL/仓库均放配置，不写死在代码） =====
# 2026-11-02 curl 验证：OpenAI RSS 200、Google AI RSS 200、
# anthropics/claude-code releases 200、openai/codex releases 200、
# QwenLM/qwen-code releases 200（QwenLM/Qwen3 无 releases，已替换为 qwen-code）。
official_sources:
  - id: openai_news
    name: OpenAI 新闻
    type: rss
    url: https://openai.com/news/rss.xml
    limit: 3
    enabled: true
  - id: google_ai_blog
    name: Google AI/Gemini 博客
    type: rss
    url: https://blog.google/technology/ai/rss/
    limit: 3
    enabled: true
  - id: anthropic_claude_code
    name: Anthropic Claude Code Releases
    type: github_releases
    owner: anthropics
    repo: claude-code
    limit: 3
    enabled: true
  - id: openai_codex
    name: OpenAI Codex Releases
    type: github_releases
    owner: openai
    repo: codex
    limit: 3
    enabled: true
  - id: qwen_code
    name: 通义千问 Qwen Code Releases
    type: github_releases
    owner: QwenLM
    repo: qwen-code
    limit: 3
    enabled: true
